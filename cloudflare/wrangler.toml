# Ahanu trip-pack data plane.
# Production delivery is Cloudflare only (Workers + Pages + R2 + D1 + Durable Objects).
# The Grok preview web client may still build through Nitro; it must not serve
# chart packs, GRIB, SST, or any other marine bytes.

name = "ahanu-packs"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
SERVICE = "ahanu-packs"
# Default operating box: Northeast U.S. shelf + canyons (see src/lib/ahanu/constants.ts).
REGION_WEST = "-75.4"
REGION_SOUTH = "36.4"
REGION_EAST = "-66.4"
REGION_NORTH = "42.6"
# GFS-Wave 72 h / 3 h series on for GET /api/packs and cron.
# Pace 0, 25 s budget. Set to "0" to force hour-0 only.
GFS_WAVE_SERIES = "1"

# Custom domain on zone ahanu.dev (active). ahanu.app is not on this account.
# workers.dev stays enabled as fallback.
[[routes]]
pattern = "api.ahanu.dev"
custom_domain = true

[[r2_buckets]]
binding = "PACKS"
bucket_name = "ahanu-trip-packs"

[[d1_databases]]
binding = "DB"
database_name = "ahanu-core"
# Live D1 `ahanu-core` (ENAM, uuid below). Same id for preview until a
# separate preview database exists. R2 `ahanu-trip-packs` is also live (ENAM).
database_id = "ed2706b8-7537-400f-88f6-933ac03120dc"
preview_database_id = "ed2706b8-7537-400f-88f6-933ac03120dc"

# Live community presence + pack-build leases. SQLite-backed DO (2024+).
[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "CommunityHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CommunityHub"]

# Ingest cron is on: builds a live PJ pack (tryLive, skipCache) and puts
# layer bodies at manifest r2Key. NOAA bytes when they landed; hashed
# fixtures otherwise. Custom domain is api.ahanu.dev; workers.dev stays up.
# GFS-Wave 72 h series is on (GFS_WAVE_SERIES=1).
# POST /api/ingest is fail-closed on secret INGEST_TOKEN (not a [vars] value).
# Cron is in-process and does not HTTP POST /api/ingest.
# HTTP skipCache / objects total-miss live NOAA rebuilds are fail-closed
# 3/60s per CF-Connecting-IP. R2 hits are not counted. Cron is not HTTP.
# POST /api/catches stays device-token Bearer (helm localStorage), bound per row to SHA-256(token).
[triggers]
crons = ["15 2,8,14,20 * * *"]
