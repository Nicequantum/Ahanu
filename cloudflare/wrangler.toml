# Ahanu trip-pack data plane.
# Production delivery is Cloudflare only (Workers + Pages + R2 + D1 + Durable Objects).
# The Grok preview web client may still build through Nitro; it must not serve
# chart packs, GRIB, SST, or any other marine bytes.

name = "ahanu-packs"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SERVICE = "ahanu-packs"
# Default operating box: Northeast U.S. shelf + canyons (see src/lib/ahanu/constants.ts).
REGION_WEST = "-75.4"
REGION_SOUTH = "36.4"
REGION_EAST = "-66.4"
REGION_NORTH = "42.6"

# ---------------------------------------------------------------------------
# TODO: reserved custom-domain route — not live, not provisioned.
# Replace pattern + zone_name after the domain is attached in the Cloudflare
# dashboard. Until then, traffic is only *.workers.dev (workers_dev = true).
# ---------------------------------------------------------------------------
[[routes]]
pattern = "api.ahanu.app/*"
zone_name = "ahanu.app"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "ahanu-trip-packs"

[[d1_databases]]
binding = "DB"
database_name = "ahanu-core"
# TODO: placeholder D1 ids — not production, not a live database.
# `wrangler d1 create ahanu-core` emits the real id. Deploy will fail or
# no-op against these zeros until they are replaced.
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"

# Live community presence + pack-build leases. SQLite-backed DO (2024+).
[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "CommunityHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CommunityHub"]

# GFS-Wave 72 h / 3 h series is off. Set to "1" only on the cron worker after
# R2 exists. ~25 NOMADS files, ~10 s apart (~4 min). GET /api/packs never
# reads this for the series (hour-0 only).
# GFS_WAVE_SERIES = "0"

# TODO: production ingest cron — commented out until R2 `ahanu-trip-packs`
# and D1 `ahanu-core` exist and NOAA/CMEMS access is in place. Until then
# /api/packs serves hashed fixture bodies. Do not assume R2 holds live ENC/GRIB/SST.
# [triggers]
# crons = ["15 2,8,14,20 * * *"]
