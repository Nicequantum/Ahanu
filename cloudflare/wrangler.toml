# Ahanu trip-pack data plane.
# Production delivery is Cloudflare only (Workers + Pages + R2 + D1 + Durable Objects).
# The Grok preview web client may still build through Nitro; it must not serve
# chart packs, GRIB, SST, or any other marine bytes.

name = "ahanu-packs"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
SERVICE = "ahanu-packs"
# Default operating box: Northeast U.S. shelf + canyons (see src/lib/ahanu/constants.ts).
REGION_WEST = "-75.4"
REGION_SOUTH = "36.4"
REGION_EAST = "-66.4"
REGION_NORTH = "42.6"

# ---------------------------------------------------------------------------
# Reserved custom-domain route — zone ahanu.app is not provisioned.
# Traffic is workers.dev only (workers_dev = true). Do not uncomment until
# the domain is attached in the Cloudflare dashboard.
# ---------------------------------------------------------------------------
# [[routes]]
# pattern = "api.ahanu.app/*"
# zone_name = "ahanu.app"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "ahanu-trip-packs"

[[d1_databases]]
binding = "DB"
database_name = "ahanu-core"
# Live D1 `ahanu-core` (ENAM, uuid below). Same id for preview until a
# separate preview database exists. R2 `ahanu-trip-packs` is also live (ENAM).
database_id = "ed2706b8-7537-400f-88f6-933ac03120dc"
preview_database_id = "ed2706b8-7537-400f-88f6-933ac03120dc"

# Live community presence + pack-build leases. SQLite-backed DO (2024+).
[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "CommunityHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CommunityHub"]

# GFS-Wave 72 h / 3 h series stays off. R2 exists; do not set this to "1"
# unless ingest is ready for ~25 NOMADS files, ~10 s apart (~4 min).
# GET /api/packs never reads this for the series (hour-0 only).
# GFS_WAVE_SERIES = "0"

# Ingest cron is on: builds a live PJ pack (tryLive, skipCache) and puts
# layer bodies at manifest r2Key. NOAA bytes when they landed; hashed
# fixtures otherwise. Custom domain still reserved; workers.dev only.
# GFS-Wave 72 h series stays off. POST /api/ingest is bearer-gated.
[triggers]
crons = ["15 2,8,14,20 * * *"]
